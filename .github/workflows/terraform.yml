name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      cluster_file:
        description: 'Path to the cluster tfvars file'
        required: true
        default: 'cluster/dev.tfvars'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.8.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  plan:
    name: Plan Terraform
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    outputs:
      tfplan_exists: ${{ steps.setplan.outputs.tfplan_exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.8.5

      - name: Install CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -o awscliv2.zip
          if command -v aws >/dev/null 2>&1; then
            sudo ./aws/install --update
          else
            sudo ./aws/install
          fi
          aws --version

      - name: Terraform init
        run: terraform init -reconfigure

      - name: Check tfvars for shutdown markers
        id: check_shutdown
        run: |
          FILE="${{ github.event.inputs.cluster_file }}"
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "no_file=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if grep -Eoq 'state[[:space:]]*=[[:space:]]*"(shutdown|poweroff)"' "$FILE"; then
            echo "shutdown_needed=true" >> $GITHUB_OUTPUT
            CLUSTER_NAME=$(grep -E '^cluster\s*=' "$FILE" | sed -E 's/^cluster\s*=\s*"([^"]+)".*/\1/' || true)
            if [ -z "$CLUSTER_NAME" ]; then
              CLUSTER_NAME=$(basename "$FILE" .tfvars)
            fi
            chmod +x ./scripts/stop-instance.sh
            ./scripts/stop-instance.sh "" "$CLUSTER_NAME"
            echo "stopped=true" >> $GITHUB_OUTPUT
          else
            echo "shutdown_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip plan if shutdown handled
        if: steps.check_shutdown.outputs.shutdown_needed == 'true'
        run: |
          echo "No terraform plan will be produced because shutdown was handled."
          echo "tfplan_exists=false" >> $GITHUB_OUTPUT
          exit 0


      - name: Terraform init
        run: terraform init -reconfigure

      - name: Terraform plan
        run: terraform plan -var-file=${{ github.event.inputs.cluster_file }} -out=tfplan -input=false

      - name: Upload tfplan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

      - name: Set plan output
        id: setplan
        run: |
          if [ -f tfplan ]; then
            echo "tfplan_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tfplan_exists=false" >> $GITHUB_OUTPUT
          fi

  apply:
    name: Apply Terraform
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.tfplan_exists == 'true'
    needs: plan
    environment: production
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.8.5
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tfplan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform init
        run: terraform init -reconfigure

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false tfplan
