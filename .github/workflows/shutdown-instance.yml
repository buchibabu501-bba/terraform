name: Shutdown EC2 Instances

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      cluster_file:
        description: 'Path to the cluster tfvars file'
        required: false
        default: 'cluster/dev.tfvars'
      instance_name:
        description: 'Instance Name tag to target (optional)'
        required: false
        default: ''
      cluster:
        description: 'Cluster tag to target (optional)'
        required: false
        default: ''

jobs:
  shutdown:
    name: Stop EC2 instances (soft stop)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install CLI tools
        run: sudo apt-get update && sudo apt-get install -y jq awscli

      - name: Terraform init (read state)
        run: terraform init -reconfigure

      - name: Stop instances via helper script
        run: |
          chmod +x ./scripts/stop-instance.sh
          ./scripts/stop-instance.sh "${{ github.event.inputs.instance_name || '' }}" "${{ github.event.inputs.cluster || '' }}"
