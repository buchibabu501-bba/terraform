name: Terminate EC2 Instances (Terraform destroy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      cluster_file:
        description: 'Path to the cluster tfvars file'
        required: false
        default: 'cluster/dev.tfvars'

permissions:
  contents: read

jobs:
  plan:
    name: Plan destroy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -o awscliv2.zip
          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already installed: $(aws --version). Running installer with --update."
            sudo ./aws/install --update
          else
            sudo ./aws/install
          fi
          aws --version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.8.5

      - name: Terraform init
        run: terraform init -reconfigure

      - name: Terraform plan destroy
        run: |
          set -euo pipefail
          CLUSTER_FILE="${{ github.event.inputs.cluster_file || '' }}"
          if [ -n "$CLUSTER_FILE" ]; then
            terraform plan -destroy -var-file="$CLUSTER_FILE" -out=tfplan -input=false
          else
            terraform plan -destroy -out=tfplan -input=false
          fi

      - name: Upload tfplan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-destroy
          path: tfplan

  apply:
    name: Apply destroy (requires approval)
    needs: plan
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tfplan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-destroy
          path: .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.8.5

      - name: Terraform init
        run: terraform init -reconfigure

      - name: Terraform apply (destroy)
        run: terraform apply -input=false tfplan
